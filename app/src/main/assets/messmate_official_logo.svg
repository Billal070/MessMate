<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF633E"/>
      <stop offset="55%" stop-color="#F83D11"/>
      <stop offset="100%" stop-color="#E02800"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0EB"/>
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE072"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#F83D11" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#F1F4FA" stroke-width="3"/>

  <!-- Boxy Rounded App Tile Badge in Full Vibrant Brand Gradient -->
  <g filter="url(#tileShadow)">
    <rect x="76" y="76" width="360" height="360" rx="92" fill="url(#primaryOrange)"/>
    <!-- Subtle top gloss / bevel highlight -->
    <path d="M 120 84 Q 256 94 392 84" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Friendly Mascot Bowl (Rendered in Clean White Ceramic & Warm Accents inside the Orange Tile) -->
  <g transform="translate(0, 32)">
    <!-- Floating steam in pure white & golden spark -->
    <path d="M 212 110 C 206 90, 220 76, 224 58" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 256 102 C 252 80, 268 66, 264 46" stroke="#FFE072" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 300 110 C 306 90, 292 76, 288 58" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Achievement Spark & Grain in Golden Glow -->
    <path d="M 346 112 Q 358 112 358 100 Q 358 112 370 112 Q 358 112 358 124 Q 358 112 346 112 Z" fill="url(#goldSun)"/>
    <circle cx="158" cy="128" r="7" fill="#FFE072"/>

    <!-- Rice Mound -->
    <ellipse cx="256" cy="180" rx="112" ry="50" fill="url(#riceGrad)"/>
    <ellipse cx="230" cy="170" rx="13" ry="5.5" fill="#FFDDD3" transform="rotate(-15 230 170)"/>
    <ellipse cx="268" cy="164" rx="15" ry="6.5" fill="#FFDDD3" transform="rotate(20 268 164)"/>
    <ellipse cx="294" cy="176" rx="11" ry="5.5" fill="#FFDDD3" transform="rotate(-10 294 176)"/>

    <!-- Mascot Ceramic Bowl in Crisp White -->
    <path d="M 142 180 
             C 146 262, 190 304, 256 304 
             C 322 304, 366 262, 370 180 
             Z" 
          fill="#FFFFFF"/>

    <!-- Bowl Rim subtle line -->
    <path d="M 142 180 Q 256 206 370 180" fill="none" stroke="#FFEAE3" stroke-width="6"/>

    <!-- Mascot Face on White Bowl (in Brand Warm Coral & Rose) -->
    <!-- Left eye: Winking joyful curve -->
    <path d="M 208 226 Q 222 240 236 226" fill="none" stroke="#F83D11" stroke-width="6" stroke-linecap="round"/>
    <!-- Right eye: Open dot -->
    <circle cx="284" cy="226" r="7.5" fill="#F83D11"/>
    <!-- Cheerful rosy cheeks -->
    <ellipse cx="190" cy="238" rx="11" ry="7" fill="#FF8D73" opacity="0.6"/>
    <ellipse cx="322" cy="238" rx="11" ry="7" fill="#FF8D73" opacity="0.6"/>
    <!-- Big warm smile -->
    <path d="M 238 248 Q 256 270 274 248" fill="none" stroke="#F83D11" stroke-width="6" stroke-linecap="round"/>

    <!-- Bowl Foot / Pedestal -->
    <path d="M 214 302 L 208 318 Q 256 325 304 318 L 298 302 Z" fill="#FFEAE3"/>
  </g>
</svg>
